<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCampus Checker</title>
    <!-- utils.js 스크립트 추가 -->
    <script src="utils.js" defer></script>
    <script src="script.js" defer></script>
    <style>
      /* ===== 1. 폰트 및 기본 설정 ===== */
      @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css");

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ===== 2. 색상 변수 (라이트 모드) ===== */
      :root {
        /* 기본 색상 */
        --primary-color: #004483;
        --primary-light: rgba(0, 68, 131, 0.06);
        --primary-hover: rgba(0, 68, 131, 0.8);
        --accent-color: #ff6b5b;

        /* 텍스트 및 배경 */
        --text-color: #333;
        --text-light: #666;
        --bg-color: #fff;

        /* 테이블 및 경계 */
        --border-color: #ddd;
        --table-hover: rgba(0, 68, 131, 0.1);
        --error-bg: rgba(255, 107, 91, 0.1);
        --empty-bg: rgba(0, 0, 0, 0.03);
        --even-row: rgba(0, 68, 131, 0.06);
        --odd-row: transparent;
        --table-header: #004483;
        --table-header-text: white;
        --shadow-color: rgba(0, 0, 0, 0.1);

        /* 마감 임박 색상 */
        --urgent-color: #ff3a30;
        --soon-color: #ff9500;
        --warning-color: #ffcc00;
      }

      /* ===== 3. 다크 모드 변수 ===== */
      .dark-mode {
        /* 기본 색상 */
        --primary-color: #4dabff;
        --primary-light: rgba(77, 171, 255, 0.2);
        --primary-hover: rgba(77, 171, 255, 0.9);
        --accent-color: #ff8a7d;

        /* 텍스트 및 배경 */
        --text-color: #ffffff;
        --text-light: #cccccc;
        --bg-color: #121212;

        /* 테이블 및 경계 */
        --border-color: #3a3a3a;
        --table-hover: rgba(77, 171, 255, 0.25);
        --error-bg: rgba(255, 95, 82, 0.3);
        --empty-bg: rgba(255, 255, 255, 0.08);
        --even-row: rgba(30, 30, 30, 1);
        --odd-row: rgba(40, 40, 40, 1);
        --table-header: #1e5799;
        --table-header-text: #ffffff;
        --shadow-color: rgba(0, 0, 0, 0.5);

        /* 마감 임박 색상 */
        --urgent-color: #ff5e57;
        --soon-color: #ffbe4a;
        --warning-color: #ffe234;
      }

      /* ===== 4. 기본 레이아웃 스타일 ===== */
      body {
        font-family: "Pretendard", sans-serif;
        font-size: 0.9rem;
        width: 600px;
        color: var(--text-color);
        background-color: var(--bg-color);
        padding: 15px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .container {
        margin-bottom: 20px;
      }

      /* ===== 5. 헤더 및 버튼 스타일 ===== */
      .header {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        padding: 0 10px;
      }

      h1 {
        flex-grow: 1;
        text-align: center;
        color: var(--primary-color);
        font-size: 1.8rem;
      }

      .btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        color: var(--primary-color);
        padding: 8px;
        border-radius: 50%;
        transition:
          background-color 0.3s,
          transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 5px;
      }

      .btn:hover {
        background-color: var(--primary-light);
        transform: scale(1.05);
      }

      .btn:active {
        transform: scale(0.95);
      }

      #theme-toggle::after {
        content: "🌙";
      }

      .dark-mode #theme-toggle::after {
        content: "☀️";
      }

      #refresh-button::after {
        content: "🔄";
      }

      /* ===== 6. 테이블 스타일 ===== */
      table {
        table-layout: fixed;
        border-collapse: collapse;
        text-align: center;
        line-height: 1.5;
        margin: 10px auto;
        width: 100%;
        box-shadow: 0 2px 8px var(--shadow-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      table caption {
        font-weight: bold;
        text-align: left;
        padding: 10px 15px;
        font-size: 1.4em;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      table .colum1 {
        width: 130px;
      }
      table .colum3 {
        width: 160px;
      }
      table .colum4 {
        width: 80px;
        text-align: center;
      }

      table thead th {
        padding: 12px 10px;
        font-weight: bold;
        vertical-align: middle;
        text-align: center;
        color: var(--table-header-text);
        background: var(--table-header);
        border-bottom: 1px solid var(--border-color);
      }

      table tbody tr {
        transition: background-color 0.2s;
      }

      table tbody tr:nth-child(odd) {
        background-color: var(--odd-row);
      }

      table tbody tr:nth-child(even) {
        background-color: var(--even-row);
      }

      table tbody tr:hover {
        background-color: var(--table-hover);
      }

      table td {
        padding: 12px 10px;
        vertical-align: middle;
        border-top: 1px solid var(--border-color);
      }

      .title {
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
        cursor: pointer;
        color: var(--primary-color);
        transition: color 0.2s;
        font-weight: 600;
      }

      .title:hover {
        text-decoration: underline;
        color: var(--primary-hover);
      }

      .badge {
        font-size: 0.7rem;
        min-width: 20px;
        line-height: 20px;
        border-radius: 10px;
        background: var(--accent-color);
        color: white;
        display: inline-block;
        vertical-align: middle;
        text-align: center;
        padding: 0 6px;
        font-weight: bold;
      }

      /* ===== 7. 상태 표시 스타일 ===== */
      .error-message,
      .empty-message {
        border-radius: 8px;
        margin: 15px 0;
        padding: 20px;
        text-align: center;
        box-shadow: 0 2px 8px var(--shadow-color);
        border: 1px solid var(--border-color);
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      .error-message {
        background-color: var(--error-bg);
        color: #fff;
        font-weight: bold;
        border-left: 4px solid var(--accent-color);
      }

      .empty-message {
        background-color: var(--empty-bg);
        color: var(--text-light);
        font-style: italic;
      }

      .urgent {
        color: var(--urgent-color) !important;
        font-weight: bold;
        animation: pulse 1.5s infinite;
      }

      .soon {
        color: var(--soon-color) !important;
        font-weight: bold;
      }

      .warning {
        color: var(--warning-color) !important;
        font-weight: 600;
      }

      /* ===== 8. 애니메이션 ===== */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
        100% {
          opacity: 1;
        }
      }

      /* ===== 9. 유틸리티 클래스 ===== */
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .loading h2 {
        margin-bottom: 20px;
        color: var(--primary-color);
        font-weight: normal;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid var(--primary-light);
        border-radius: 50%;
        border-top-color: var(--primary-color);
        animation: spin 1s ease-in-out infinite;
      }

      .dark-mode .spinner {
        border-color: rgba(77, 171, 255, 0.2);
        border-top-color: #4dabff;
      }

      /* 툴팁 스타일 */
      .tooltip-container {
        position: relative;
        display: inline-block;
      }

      .tooltip {
        visibility: hidden;
        position: absolute;
        z-index: 1;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%);
        min-width: 160px;
        background-color: var(--primary-color);
        color: white;
        text-align: center;
        padding: 8px 12px;
        border-radius: 6px;
        opacity: 0;
        transition: opacity 0.3s;
        box-shadow: 0 2px 10px var(--shadow-color);
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: var(--primary-color) transparent transparent transparent;
      }

      .tooltip-container:hover .tooltip {
        visibility: visible;
        opacity: 1;
      }

      /* ===== 10. 푸터 스타일 ===== */
      .footer {
        text-align: right;
        padding: 15px 15px 0;
        margin-top: 20px;
        border-top: 1px solid var(--border-color);
        color: var(--text-light);
        font-size: 0.8rem;
        opacity: 0.8;
        transition: opacity 0.3s;
      }

      .footer:hover {
        opacity: 1;
      }

      .footer a {
        color: var(--primary-color);
        text-decoration: none;
        transition: color 0.2s;
      }

      .footer a:hover {
        text-decoration: underline;
        color: var(--primary-hover);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <button id="theme-toggle" class="btn" aria-label="테마 변경">
        <span class="tooltip-container">
          <span class="tooltip">다크모드 전환</span>
        </span>
      </button>
      <h1>아캠체크</h1>
      <button id="refresh-button" class="btn" aria-label="새로고침">
        <span class="tooltip-container">
          <span class="tooltip">새로고침</span>
        </span>
      </button>
    </div>

    <div class="container" id="lecture"></div>
    <div class="container" id="assignment">
      <div class="loading">
        <h2>데이터를 불러오는 중입니다...</h2>
        <div class="spinner"></div>
        <div class="connection-status">
          <span class="status-dot connecting"></span>
          <span id="status-text">서버에 연결 중...</span>
        </div>
      </div>
    </div>

    <!-- 크레딧 푸터 -->
    <footer class="footer">
      <p>
        Originally created by
        <a href="https://github.com/ductility/iCampusCheck" target="_blank"
          >ductility</a
        >
        |
        <a href="https://github.com/moseoridev/iCampusCheck" target="_blank"
          >GitHub Repo</a
        >
      </p>
    </footer>
  </body>
</html>
