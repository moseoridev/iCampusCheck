<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCampus Checker</title>
    <script src="utils.js"></script>
    <script src="script.js" defer></script>
    <style>
      @import url(https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@1.0/nanumsquare.css);

      :root {
        /* 라이트 모드 변수 */
        --primary-color: #004483;
        --primary-light: rgba(0, 68, 131, 0.06);
        --primary-hover: rgba(0, 68, 131, 0.8);
        --accent-color: #ff6b5b;
        --border-color: #ccc;
        --text-color: #333;
        --text-light: #666;
        --bg-color: #fff;
        --table-hover: rgba(0, 68, 131, 0.1);
        --error-bg: rgba(255, 107, 91, 0.1);
        --empty-bg: rgba(0, 0, 0, 0.03);
        --even-row: var(--primary-light);

        /* 마감 임박 색상 */
        --urgent-color: #ff3a30;
        --soon-color: #ff9500;
        --warning-color: #ffcc00;
      }

      /* 다크 모드 변수 */
      .dark-mode {
        --primary-color: #4a89ca;
        --primary-light: rgba(74, 137, 202, 0.15);
        --primary-hover: rgba(74, 137, 202, 0.9);
        --accent-color: #ff8a7d;
        --border-color: #444;
        --text-color: #eee;
        --text-light: #bbb;
        --bg-color: #222;
        --table-hover: rgba(74, 137, 202, 0.2);
        --error-bg: rgba(255, 107, 91, 0.2);
        --empty-bg: rgba(255, 255, 255, 0.05);
        --even-row: rgba(74, 137, 202, 0.1);

        /* 다크모드 마감 임박 색상 */
        --urgent-color: #ff5e57;
        --soon-color: #ffb340;
        --warning-color: #ffd60a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "NanumSquare", sans-serif;
        font-size: 0.9rem;
        width: 640px;
        color: var(--text-color);
        background-color: var(--bg-color);
        padding: 15px;
        transition: background-color 0.3s, color 0.3s;
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        padding: 0 10px;
      }

      h1 {
        flex-grow: 1;
        text-align: center;
        color: var(--primary-color);
        font-size: 1.8rem;
      }

      .btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.2rem;
        color: var(--primary-color);
        padding: 8px;
        border-radius: 50%;
        transition: background-color 0.3s, transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn:hover {
        background-color: var(--primary-light);
      }

      .btn:active {
        transform: scale(0.95);
      }

      #theme-toggle::after {
        content: "🌙";
      }

      .dark-mode #theme-toggle::after {
        content: "☀️";
      }

      #refresh-button::after {
        content: "🔄";
      }

      .container {
        margin-bottom: 20px;
      }

      table {
        table-layout: fixed;
        border-collapse: collapse;
        text-align: left;
        line-height: 1.5;
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
        margin: 10px auto;
        width: 100%;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        border-radius: 6px;
        overflow: hidden;
      }

      table caption {
        font-weight: bold;
        text-align: left;
        padding: 10px 0;
        margin-left: 10px;
        font-size: 1.4em;
        color: var(--primary-color);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      table .colum1 {
        width: 130px;
      }

      table .colum3 {
        width: 160px;
      }

      table .colum4 {
        width: 70px;
        text-align: center;
      }

      table thead th {
        padding: 12px 10px;
        font-weight: bold;
        vertical-align: middle;
        text-align: center;
        color: white;
        background: var(--primary-color);
      }

      table tbody tr {
        transition: background-color 0.2s;
      }

      table tbody tr:hover {
        background-color: var(--table-hover);
      }

      table td {
        padding: 10px;
        vertical-align: middle;
        border-top: 1px solid var(--border-color);
      }

      table .even {
        background: var(--even-row);
      }

      .title {
        position: relative;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
        cursor: pointer;
        color: var(--primary-color);
        transition: all 0.2s;
      }

      .title:hover {
        text-decoration: underline;
        color: var(--primary-hover);
      }

      .badge {
        font-size: 0.7rem;
        min-width: 18px;
        line-height: 18px;
        border-radius: 9px;
        background: var(--accent-color);
        color: white;
        display: inline-block;
        vertical-align: middle;
        text-align: center;
        box-sizing: border-box;
        padding: 0 6px;
        transition: all 0.2s;
      }

      .error-message {
        color: var(--accent-color);
        text-align: center;
        padding: 20px;
        font-weight: bold;
        background-color: var(--error-bg);
        border-radius: 6px;
        margin: 10px 0;
      }

      .empty-message {
        color: var(--text-light);
        text-align: center;
        padding: 20px;
        font-style: italic;
        background-color: var(--empty-bg);
        border-radius: 6px;
      }

      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .loading h2 {
        margin-bottom: 20px;
        color: var(--primary-color);
        font-weight: normal;
      }

      /* 로딩 스피너 */
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--primary-light);
        border-radius: 50%;
        border-top-color: var(--primary-color);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* 마감 임박 표시 */
      .urgent {
        color: var(--urgent-color) !important;
        font-weight: bold;
        animation: pulse 2s infinite;
      }

      .soon {
        color: var(--soon-color) !important;
        font-weight: bold;
      }

      .warning {
        color: var(--warning-color) !important;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <button id="theme-toggle" class="btn" aria-label="테마 변경"></button>
      <h1>아캠체크</h1>
      <button id="refresh-button" class="btn" aria-label="새로고침"></button>
    </div>

    <div class="container" id="lecture"></div>
    <div class="container" id="assignment">
      <div class="loading">
        <h2>데이터를 불러오는 중입니다...</h2>
        <div class="spinner"></div>
      </div>
    </div>
  </body>
</html>
